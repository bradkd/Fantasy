<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Activity Feed</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased p-6">

    <div class="max-w-3xl mx-auto">
        <!-- Dashboard Header -->
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Fantasy Dashboard</h1>
            </div>
        </div>

        <!-- Styled Container for the List -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <ul class="divide-y divide-slate-100">
                
                {% for entry in log_entries.splitlines() %}
		    {% set columns = row.split('|')%}
		    {% if columns|length >= 2 %}
		    <tr class="hover:bg-slate-50">
        	        <td class="px-6 py-4">{{ columns[0]|trim }}</td>
        		<td class="px-6 py-4">{{ columns[1]|trim }}</td>
                    </tr>
                    <li class="px-6 py-4 hover:bg-slate-50 transition-colors flex items-start space-x-3">
                    
                    <!-- The string prints here directly -->
                    <span class="text-sm font-medium text-slate-700 font-mono tracking-tight">
                        {{ entry }}
                    </span>
                </li>
                {% endfor %}
                
            </ul>
        </div>
    </div>

</body>
</html>
