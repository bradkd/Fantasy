<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Activity Feed</title>
    <!-- Tailwind CSS for clean layout -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased p-6">

    <div class="max-w-3xl mx-auto">
        <!-- Dashboard Header -->
        <div class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Activity Log</h1>
                <p class="text-sm text-slate-500">Live operational events from your application</p>
            </div>
            <!-- Quick badge counting the list items dynamically -->
            <span class="bg-indigo-100 text-indigo-800 text-xs font-semibold px-3 py-1 rounded-full">
                {{ log_entries|length }} Total Events
            </span>
        </div>

        <!-- Styled Container for the List -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <ul class="divide-y divide-slate-100">
                
                {% for entry in log_entries %}
                <li class="px-6 py-4 hover:bg-slate-50 transition-colors flex items-start space-x-3">
                    <!-- Modern accent indicator dot -->
                    <span class="mt-2 h-2 w-2 rounded-full bg-indigo-500 shrink-0"></span>
                    
                    <!-- The string prints here directly -->
                    <span class="text-sm font-medium text-slate-700 font-mono tracking-tight">
                        {{ entry }}
                    </span>
                </li>
                {% endfor %}
                
            </ul>
        </div>
    </div>

</body>
</html>
